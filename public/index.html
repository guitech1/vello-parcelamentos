<script>
/* ===== 4. DADOS FICTÍCIOS (centralizados) ===== */
const KEY='vello_demo_v1',DAY=864e5;
const now=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
const addDays=(d,n)=>new Date(+new Date(d)+n*DAY).toISOString();
const BUY=[['Camila Duarte','52998224725','11987654321'],['Rafael Nogueira','11144477735','21976543210'],['Beatriz Lemos','39053344705','31965432109'],['Thiago Viana','86288366757','41954321098'],['Larissa Prado','71428793860','51943210987'],['Diego Albuquerque','24971563792','61932109876']];
const split=(t,n)=>{const b=Math.floor(t/n);return Array.from({length:n},(_,i)=>i<n-1?b:t-b*(n-1))};
function mk(id,owner,store,b,total,n,paid,ago,summary,status){
 const c=addDays(now(),-ago),v=split(total,n);
 return{id,owner,store,buyer:{name:BUY[b][0],cpf:BUY[b][1],phone:BUY[b][2]},total,n,created:c,summary,status:status||(paid>=n?'Quitada':paid>0?'Ativa':'Aguardando'),
 inst:v.map((x,i)=>({n:i+1,value:x,due:addDays(c,i*30),paidAt:i<paid?addDays(c,i*30):null}))};
}
function seed(){
 const names=[['Marina Teixeira','Casa Aurora Moda'],['Paulo Siqueira','Siqueira Eletro'],['Helena Costa','Atelier Helena'],['Bruno Matos','Matos Sneakers'],['Júlia Ramos','Ramos Cosméticos'],['Otávio Pires','Pires Games'],['Sara Nunes','Nunes Pet Shop'],['Caio Barros','Barros Bikes'],['Laura Fontes','Fontes Joias'],['Igor Melo','Melo Tech'],['Renata Dias','Dias Decor'],['Felipe Cruz','Cruz Fitness']];

 const users=names.map((n,i)=>({id:'u'+(i+1),name:n[0],store:n[1],email:n[1].toLowerCase().replace(/[^a-z]/g,'')+'@exemplo.demo',phone:'(11) 9'+String(8000+i*137).padStart(4,'0')+'-'+String(1200+i*311).slice(0,4),tiktok:'@'+n[1].toLowerCase().replace(/[^a-z]/g,''),reg:addDays(now(),-20-i*17),status:i?st[i%6]:'Ativo',bal:i?40000+i*9100:125000,rel:i?15000:38000}));
 const me='u1',mn=names[0][1],o=(i)=>names[i][1];
 const sales=[mk('VL-1001',me,mn,0,48000,4,4,130,'Vestido linho e bolsa'),mk('VL-1002',me,mn,1,129900,6,2,70,'Conjunto outono completo'),mk('VL-1003',me,mn,2,35000,2,1,45,'Blazer alfaiataria'),mk('VL-1004',me,mn,3,89990,5,2,60,'Kit três peças premium'),mk('VL-1005',me,mn,4,24500,1,1,20,'Camisa estampada'),mk('VL-1006',me,mn,5,76000,3,0,3,'Coleção primavera'),mk('VL-1007',me,mn,0,52000,4,1,35,'Sandália e acessórios'),mk('VL-1008',me,mn,1,18900,3,0,40,'Cinto de couro','Expirada'),
 mk('VL-2001','u2',o(1),2,299000,10,3,95,'Smart TV 50 polegadas'),mk('VL-2002','u3',o(2),3,64000,4,2,55,'Joia sob encomenda'),mk('VL-2003','u4',o(3),4,98000,5,1,40,'Tênis edição limitada'),mk('VL-2004','u5',o(4),5,42000,2,2,30,'Kit skincare'),mk('VL-2005','u6',o(5),0,189900,6,0,6,'Console e jogos'),mk('VL-2006','u9',o(8),1,72000,3,1,38,'Colar e brincos')];
 const wd=[{id:'SQ-301',owner:me,store:mn,name:users[0].name,amount:90000,keyType:'CPF',key:'52998224725',holder:users[0].name,date:addDays(now(),-25),status:'Concluído'},{id:'SQ-302',owner:me,store:mn,name:users[0].name,amount:25000,keyType:'E-mail',key:'contato@casaaurora.demo',holder:users[0].name,date:addDays(now(),-9),status:'Rejeitado'},
 {id:'SQ-303','owner':'u2',store:o(1),name:names[1][0],amount:60000,keyType:'CNPJ',key:'11222333000181',holder:o(1)+' LTDA',date:addDays(now(),-2),status:'Aguardando aprovação'},{id:'SQ-304',owner:'u3',store:o(2),name:names[2][0],amount:30000,keyType:'Telefone',key:'11988887777',holder:names[2][0],date:addDays(now(),-1),status:'Aguardando aprovação'},{id:'SQ-305',owner:'u9',store:o(8),name:names[8][0],amount:42000,keyType:'Chave aleatória',key:'3f9c2a1e-77b4-4c1a-9d0e-5a8b1c2d3e4f',holder:names[8][0],date:addDays(now(),-1),status:'Aguardando aprovação'}];
 return{users,sales,wd,maint:false,session:null};
}
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const me=()=>S.users[0],mine=()=>S.sales.filter(s=>s.owner==='u1');
const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=i=>new Date(i).toLocaleDateString('pt-BR');
const dig=s=>String(s||'').replace(/\D/g,'');
const ist=i=>i.paidAt?'Paga':new Date(i.due)<now()?'Vencida':'Pendente';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const mCpf=c=>{const d=dig(c);return`***.${d.slice(3,6)}.${d.slice(6,9)}-**`};
const mTel=t=>{const d=dig(t);return`(${d.slice(0,2)}) *****-${d.slice(-4)}`};
const mKey=(t,k)=>t==='E-mail'?k[0]+'***'+k.slice(k.indexOf('@')):t==='Chave aleatória'?k.slice(0,4)+'…'+k.slice(-4):'***'+k.slice(-4);
const maskCpf=v=>dig(v).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
const maskTel=v=>{const d=dig(v).slice(0,11);return d.length>6?`(${d.slice(0,2)}) ${d.slice(2,d.length>10?7:6)}-${d.slice(d.length>10?7:6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d};
const first=n=>n.split(' ')[0];
/* ===== 5. SERVIÇOS SIMULADOS ===== */
const has=(q,...f)=>!q||f.join(' ').toLowerCase().includes(q);
const API={
 dashboard(){const ins=mine().flatMap(s=>s.inst.map(i=>({...i,s})));const paid=ins.filter(i=>i.paidAt),open=ins.filter(i=>!i.paidAt);
  const months=Array.from({length:6},(_,k)=>{const d=new Date(now());d.setMonth(d.getMonth()-5+k);return{l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),m:d.getMonth(),y:d.getFullYear(),v:0}});

 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Comprador</h2><div class="li"><span class="mut">Nome</span><b>${esc(s.buyer.name)}</b></div><div class="li"><span class="mut">CPF</span><span>${mCpf(s.buyer.cpf)}</span></div><div class="li"><span class="mut">Telefone</span><span>${mTel(s.buyer.phone)}</span></div><div class="li"><span class="mut">Resumo</span><span>${esc(s.summary)}</span></div></div>

 row:r=>[esc(r.s.buyer.name),`<a href="#/app/venda/${r.s.id}">${r.s.id}</a>`,`${r.i.n}/${r.s.n}`,`<b class="num">${fmt(r.i.value)}</b>`,fd(r.i.paidAt||r.i.due),badge(r.st)]});return{title:'Pagamentos',html:L.html,mount:L.mount}};
const KT=['CPF','CNPJ','E-mail','Telefone','Chave aleatória'];
const keyOk={CPF:v=>okCpf(v),CNPJ:v=>dig(v).length===14,'E-mail':okEmail,Telefone:okTel,'Chave aleatória':v=>/^[0-9a-f-]{32,36}$/i.test(v.trim())};
P.saques=()=>{const d=API.dashboard();const L=list({ph:'Buscar solicitação',per:5,get:q=>S.wd.filter(w=>w.owner==='u1'&&has(q,w.id,w.status)).sort((a,b)=>b.date.localeCompare(a.date)),heads:['Código','Valor','Chave Pix','Data','Status'],empty:'Nenhuma solicitação ainda',row:w=>[w.id,`<b class="num">${fmt(w.amount)}</b>`,`${w.keyType}: ${esc(mKey(w.keyType,w.key))}`,fd(w.date),badge(w.status)]});
 return{title:'Saques',html:`<div class="grid g4" id="wk">${kpi('Saldo disponível',fmt(d.avail),'Disponível para saque','main')}${kpi('Em processamento',fmt(d.proc),'Aguardando aprovação')}</div><div class="grid g2" style="margin:16px 0;align-items:start"><form class="card stack" id="wf" novalidate><h2>Solicitar saque</h2><div class="f" id="f-wv"><label for="wv">Valor</label><div class="row" style="flex-wrap:nowrap"><input id="wv" inputmode="numeric" placeholder="R$ 0,00"><button type="button" class="btn btn-s" data-act="max">MAX</button></div><div class="er" id="e-wv"></div></div>${sel('wt','Tipo de chave Pix',KT,'CPF')}${fld('wk2','Chave Pix')}${fld('wh','Titular da conta','value="'+esc(me().name)+'"')}<button class="btn btn-p">Solicitar saque</button><p class="mut sm">Demonstração: nenhuma transferência real é feita.</p></form><div class="card"><h2 style="margin-bottom:8px">Como funciona</h2><p class="mut">Ao solicitar, o valor sai do saldo disponível e passa a “em processamento” até a aprovação do administrador (demonstrativo). Valores a liberar e parcelas futuras não entram no saldo.</p></div></div><h2 style="margin-bottom:8px">Histórico de solicitações</h2>`+L.html,
 mount(){L.mount();money($('#wv'));$('#wf').onsubmit=e=>{e.preventDefault();const t=$('#wt').value;
  if(!check([['wv',()=>cents($('#wv'))>=100&&cents($('#wv'))<=me().bal,cents($('#wv'))>me().bal?'Valor maior que o saldo disponível.':'Informe um valor de pelo menos R$ 1,00.'],['wk2',keyOk[t],'Chave inválida para o tipo '+t+'.'],['wh',v=>v.trim().length>=3,'Informe o titular.']]))return;
  const a=cents($('#wv')),k=$('#wk2').value.trim();confirmD('Confirmar saque',`Solicitar ${fmt(a)} para a chave ${t}: ${esc(mKey(t,k))}?`,'Confirmar saque',()=>{API.withdraw({amount:a,keyType:t,key:dig(k)&&t!=='E-mail'&&t!=='Chave aleatória'?dig(k):k,holder:$('#wh').value.trim()});toast('Saque solicitado: aguardando aprovação');route()})}}}};
P.suporte=()=>({title:'Suporte',html:`<div class="grid g2"><div class="card"><h2>Central de ajuda</h2>${[['Como funciona o parcelamento?','Você cria um link, o comprador confirma e paga a primeira parcela via Pix. As demais parcelas seguem os vencimentos mostrados no detalhe da venda.'],['Quando o saldo fica disponível?','Parcelas pagas entram em “a liberar” e passam ao saldo conforme as regras da plataforma. Nesta demonstração, os valores são fictícios.'],['Como solicito um saque?','Em Saques, informe valor e chave Pix. A solicitação fica aguardando aprovação.']].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>
 <form class="card stack" id="sf" novalidate><h2>Abrir chamado (demonstração)</h2>${fld('sa','Assunto')}<div class="f" id="f-sm"><label for="sm">Mensagem</label><textarea id="sm"></textarea><div class="er" id="e-sm"></div></div><button class="btn btn-p">Enviar chamado</button><p class="mut sm">Canais de atendimento oficiais serão definidos na versão final.</p></form></div>`,

P.perfil=()=>({title:'Perfil e configurações',html:`<form class="card stack" id="pf" novalidate style="max-width:640px"><div class="fg">${fld('nm','Nome','value="'+esc(me().name)+'"')}${fld('lj','Loja','value="'+esc(me().store)+'"')}${fld('em','E-mail','type="email" value="'+esc(me().email)+'"')}${fld('tl','Telefone','value="'+esc(me().phone)+'"')}${fld('tk','TikTok','value="'+esc(me().tiktok)+'"')}</div><div class="row"><button class="btn btn-p">Salvar alterações</button><button type="button" class="btn btn-s" data-act="logout">Sair da sessão</button><button type="button" class="btn btn-d" data-act="reset">Restaurar dados de demonstração</button></div></form>`,
 mount(){$('#tl').oninput=e=>e.target.value=maskTel(e.target.value);$('#pf').onsubmit=e=>{e.preventDefault();if(!check([['nm',v=>v.trim().length>=3,'Informe o nome.'],['lj',v=>v.trim().length>=2,'Informe a loja.'],['em',okEmail,'E-mail inválido.'],['tl',okTel,'Telefone inválido.'],['tk',v=>!v||/^@?[\w.]{2,24}$/.test(v.trim()),'Use o formato @usuario.']]))return;
  Object.assign(me(),{name:$('#nm').value.trim(),store:$('#lj').value.trim(),email:$('#em').value.trim(),phone:$('#tl').value,tiktok:$('#tk').value.trim()});save();toast('Perfil atualizado');route()}}});
/* ===== 8. CHECKOUT PÚBLICO ===== */
let CK={id:null,stage:'resumo'};
function checkout(id){
 if(CK.id!==id)CK={id,stage:'resumo'};
 let s=S.sales.find(x=>x.id===id);if(id==='expirado')s=S.sales.find(x=>x.status==='Expirada');
 const wrap=b=>`<div class="co"><div class="top">${brand()}<span class="badge b-w">Ambiente de demonstração</span></div>${b}<p class="mut sm" style="text-align:center;margin-top:16px">Ver estados: <a href="#/checkout/invalido">link inválido</a> · <a href="#/checkout/expirado">link expirado</a></p></div>`;
 const msg=(t,d)=>wrap(`<div class="card">${empty(t,d)}<div style="text-align:center"><a class="btn btn-s" href="#/login">Ir para a Vello</a></div></div>`);
 if(!s)return{html:msg('Link inválido','Este link não existe. Confira o endereço com o lojista.')};
 if(s.status==='Expirada')return{html:msg('Link expirado','O prazo desta compra terminou. Peça um novo link ao lojista.')};
 const nx=s.inst.find(i=>!i.paidAt),b=s.buyer;
 const head=`<div class="card stack"><p class="mut sm">Compra processada por: <b style="color:var(--tx)">Vello Parcelamentos</b></p><div class="row sb"><div><b>${esc(s.store)}</b><div class="mut sm">${esc((S.users.find(u=>u.id===s.owner)||{}).email||'')}</div></div>${badge(s.status)}</div>`;
 if(!nx&&CK.stage!=='ok')return{html:wrap(head+`<div class="ok-box">Todas as parcelas desta compra foram pagas.</div></div>`)};
 if(CK.stage==='pix'){const code=`DEMO-VELLO-${s.id}-P${nx.n}-NAO-UTILIZAVEL`;return{html:wrap(head+`<div class="note">Dados simulados: este código não gera cobrança real.</div><div style="text-align:center"><div class="mut">Parcela ${nx.n} de ${s.n}</div><div style="font-size:28px;font-weight:700" class="num">${fmt(nx.value)}</div><div>${badge('Aguardando')} <span class="mut sm">Aguardando pagamento</span></div></div><div class="qr">Espaço reservado para QR Code (demonstrativo)</div><div class="code">${code}</div><button class="btn btn-s btn-w" data-act="copy" data-t="${code}">Copiar código Pix</button><div class="mut sm"><b>Como pagar:</b> abra o app do seu banco, escolha Pix, cole o código e confirme. Depois de pagar, o status muda para confirmado.</div><button class="btn btn-p btn-w" data-act="paydemo" data-id="${s.id}">Simular pagamento confirmado</button></div>`)}}
 if(CK.stage==='ok'){const rest=s.inst.filter(i=>!i.paidAt);return{html:wrap(head+`<div class="ok-box"><b>Pagamento confirmado</b><div class="sm">Parcela paga na demonstração. A confirmação já está disponível para o lojista.</div></div><h2>Próximas parcelas</h2>${rest.length?rest.map(i=>`<div class="li"><span>Parcela ${i.n}/${s.n} · vence em ${fd(i.due)}</span><b class="num">${fmt(i.value)}</b></div>`).join(''):'<p class="mut">Compra quitada.</p>'}${rest.length?`<button class="btn btn-s btn-w" data-act="again">Gerar Pix da próxima parcela</button>`:''}</div>`)}}
 return{html:wrap(head+`<div class="li"><span class="mut">Valor total</span><b class="num">${fmt(s.total)}</b></div><div class="li"><span class="mut">Parcelamento</span><b>${s.n}x sem juros</b></div><div class="li"><span class="mut">${nx.n===1?'Primeira parcela':'Próxima parcela (' +nx.n+'/'+s.n+')'}</span><b class="num">${fmt(nx.value)}</b></div><h2>Dados do comprador</h2><div class="li"><span class="mut">Nome</span><span>${esc(b.name)}</span></div><div class="li"><span class="mut">CPF</span><span>${mCpf(b.cpf)}</span></div><div class="li"><span class="mut">Telefone</span><span>${mTel(b.phone)}</span></div><button class="btn btn-p btn-w" data-act="genpix">Confirmar compra e gerar Pix</button></div>`)}}
/* ===== 9. PAINEL ADMINISTRATIVO ===== */
const A={};
A.login=()=>({html:authWrap(`<div><h1>Painel administrativo</h1><p class="mut">Acesso demonstrativo, sem autenticação real. Não use credenciais verdadeiras.</p></div><button class="btn btn-p btn-w" data-act="adminin">Entrar como administrador (demonstração)</button><a class="sm" href="#/login">Voltar ao login do lojista</a>`)});
A.dashboard=()=>{const d=API.admin();return{title:'Painel administrativo',html:`<div class="${S.maint?'note':'ok-box'}" style="margin-bottom:16px">Estado de manutenção: <b>${S.maint?'ativado (demonstração)':'desativado'}</b> · <a href="#/admin/manutencao">gerenciar</a></div>
 <div class="grid g4">${kpi('Total de lojistas',d.users)}${kpi('Pagamentos pendentes',d.pend,'Parcelas a receber')}${kpi('Pagamentos confirmados',d.conf,'Parcelas pagas')}${kpi('Volume de vendas',fmt(d.vol),'Soma dos links criados')}${kpi('Saques aguardando',d.awN,fmt(d.awV),'main')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2 style="margin-bottom:8px">Atividade recente</h2>${d.act.map(a=>`<div class="li"><span>${esc(a.t)}</span><span class="mut sm">${fd(a.d)}</span></div>`).join('')}</div>
 <div class="card"><h2 style="margin-bottom:8px">Solicitações pendentes</h2>${d.aw.length?d.aw.map(w=>`<div class="li"><div><b>${esc(w.store)}</b><div class="mut sm">${w.id} · ${fmt(w.amount)}</div></div><a class="btn btn-s btn-sm" href="#/admin/saques">Analisar</a></div>`).join(''):empty('Nenhuma solicitação pendente')}</div></div>
 <div class="card" style="margin-top:16px"><h2 style="margin-bottom:8px">Últimas vendas</h2>${tbl(['Código','Loja','Comprador','Valor','Status'],d.last.map(s=>[s.id,esc(s.store),esc(s.buyer.name),`<span class="num">${fmt(s.total)}</span>`,badge(s.status)]))}</div>`}};
A.usuarios=()=>{const L=list({ph:'Buscar lojista, loja ou e-mail',per:6,opts:['Ativo','Pendente','Suspenso'],get:(q,st)=>S.users.filter(u=>(!st||u.status===st)&&has(q,u.name,u.store,u.email)),heads:['Nome','Loja','E-mail','Telefone','Cadastro','Status',''],empty:'Nenhum usuário encontrado',
 row:u=>[esc(u.name),esc(u.store),esc(u.email),esc(u.phone),fd(u.reg),badge(u.status),`<button class="btn btn-s btn-sm" data-act="user" data-id="${u.id}">Detalhes</button>`]});return{title:'Usuários',html:L.html,mount:L.mount}};
A.pagamentos=()=>{const L=list({ph:'Buscar por código, loja ou comprador',opts:['Aguardando','Ativa','Quitada','Expirada'],get:(q,st)=>S.sales.filter(s=>(!st||s.status===st)&&has(q,s.id,s.store,s.buyer.name)).sort((a,b)=>b.created.localeCompare(a.created)),heads:['Código','Loja','Comprador','Valor','Data','Status','Restantes'],empty:'Nenhum pagamento encontrado',
 row:s=>[`<b>${s.id}</b>`,esc(s.store),esc(s.buyer.name),`<span class="num">${fmt(s.total)}</span>`,fd(s.created),badge(s.status),s.inst.filter(i=>!i.paidAt).length+' de '+s.n]});return{title:'Pagamentos',html:L.html,mount:L.mount}};
A.saques=()=>{const L=list({ph:'Buscar lojista ou código',per:6,opts:['Aguardando aprovação','Concluído','Rejeitado'],get:(q,st)=>S.wd.filter(w=>(!st||w.status===st)&&has(q,w.id,w.store,w.name)).sort((a,b)=>b.date.localeCompare(a.date)),heads:['Lojista','Valor','Saldo demonstrativo','Chave Pix','Data','Status','Ações'],empty:'Nenhuma solicitação',
 row:w=>[`<b>${esc(w.store)}</b><div class="mut sm">${esc(w.name)}</div>`,`<b class="num">${fmt(w.amount)}</b>`,`<span class="num">${fmt(S.users.find(u=>u.id===w.owner).bal)}</span>`,`${w.keyType}: ${esc(mKey(w.keyType,w.key))}`,fd(w.date),badge(w.status),w.status==='Aguardando aprovação'?`<div class="row"><button class="btn btn-p btn-sm" data-act="wd" data-ok="1" data-id="${w.id}">Aprovar</button><button class="btn btn-d btn-sm" data-act="wd" data-id="${w.id}">Rejeitar</button></div>`:'—']});
 return{title:'Aprovação de saques',html:`<div class="note" style="margin-bottom:12px">Ações demonstrativas: nenhuma transferência real é executada.</div>`+L.html,mount(){L.mount();window._L=L}}};
A.manutencao=()=>({title:'Modo de manutenção',html:`<div class="grid g2" style="align-items:start"><div class="card stack"><h2>Estado demonstrativo</h2><p class="mut">Ativar apenas altera a prévia abaixo. Nenhum acesso é bloqueado de fato.</p><div>${badge(S.maint?'Pendente':'Ativo').replace(S.maint?'Pendente':'Ativo',S.maint?'Manutenção ativada':'Operação normal')}</div><button class="btn ${S.maint?'btn-s':'btn-p'}" data-act="maint">${S.maint?'Desativar manutenção':'Ativar manutenção'}</button></div>
 <div class="card"><h2 style="margin-bottom:12px">Prévia da página pública</h2><div style="border:1px dashed var(--bd);border-radius:var(--rs);padding:32px 16px;text-align:center;background:var(--bg)">${brand().replace('class="brand"','class="brand" style="justify-content:center;margin-bottom:12px"')}<b>${S.maint?'Estamos em manutenção':'Tudo funcionando'}</b><p class="mut">${S.maint?'Voltamos em instantes. Suas parcelas continuam seguras.':'A página pública exibiria o checkout normalmente.'}</p></div></div></div>`});
/* ===== 10. EVENTOS E INTERAÇÕES ===== */
const ACT={
 copy:b=>copy(b.dataset.t),
 pw:b=>{const i=$('#'+b.dataset.t);i.type=i.type==='password'?'text':'password'},
 menu:()=>{const m=$('#menu');m.hidden=!m.hidden},
 logout:()=>{S.session=null;save();toast('Sessão encerrada');location.hash='#/login'},
 reset:()=>confirmD('Restaurar dados de demonstração','Todos os registros locais voltarão ao estado inicial.','Restaurar',()=>{S=seed();save();toast('Dados restaurados');location.hash='#/login';route()},'btn-d'),
 demo:()=>{$('#em').value='demo@casaaurora.demo';$('#pw').value='demo1234';$('#lf').requestSubmit()},
 forgot:(b,e)=>{e.preventDefault();modal({title:'Recuperar senha',body:`<p class="mut" style="margin-bottom:12px">Simulação: nenhum e-mail será enviado.</p><input id="rem" type="email" placeholder="seu@email.com" aria-label="E-mail">`,ok:'Enviar link',fn:()=>toast('Se o e-mail existir, enviaríamos um link (simulado)')})},
 max:()=>{const el=$('#wv');el.dataset.c=me().bal;el.value=fmt(me().bal)},
 genpix:()=>{CK.stage='pix';route()},
 again:()=>{CK.stage='pix';route()},
 paydemo:b=>confirmD('Confirmar pagamento fictício','Isto simula o pagamento da parcela e atualiza o histórico e os indicadores. Nenhum dinheiro é movimentado.','Confirmar pagamento',()=>{API.pay(b.dataset.id);CK.stage='ok';toast('Pagamento confirmado (demonstração)');route()}),
 adminin:()=>{S.session='admin';save();location.hash='#/admin/dashboard'},
 maint:()=>{S.maint=!S.maint;save();toast(S.maint?'Manutenção ativada (demo)':'Manutenção desativada');route()},
 user:b=>{const u=S.users.find(x=>x.id===b.dataset.id);modal({title:u.name,ok:'Fechar',body:`<div class="li"><span class="mut">Loja</span>${esc(u.store)}</div><div class="li"><span class="mut">E-mail</span>${esc(u.email)}</div><div class="li"><span class="mut">Telefone</span>${esc(u.phone)}</div><div class="li"><span class="mut">TikTok</span>${esc(u.tiktok)}</div><div class="li"><span class="mut">Saldo (fictício)</span>${fmt(u.bal)}</div><div class="li"><span class="mut">Vendas</span>${S.sales.filter(s=>s.owner===u.id).length}</div>`})},
 wd:b=>{const ok=b.dataset.ok==='1',w=S.wd.find(x=>x.id===b.dataset.id);confirmD(ok?'Aprovar saque':'Rejeitar saque',`${ok?'Aprovar':'Rejeitar'} ${fmt(w.amount)} de ${esc(w.store)}? ${ok?'':'O valor volta ao saldo do lojista.'} (demonstração)`,ok?'Aprovar':'Rejeitar',()=>{API.adminWd(w.id,ok);toast(ok?'Saque aprovado (simulado)':'Saque rejeitado');route()},ok?'btn-p':'btn-d')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act]){ACT[b.dataset.act](b,e);}
 else if(!e.target.closest('.top'))document.querySelectorAll('#menu').forEach(m=>m.hidden=true)});
/* ===== 11. INICIALIZAÇÃO E ROTEAMENTO ===== */
function route(){
 const [a,b,c]=(location.hash.slice(2)||'login').split('/'),app=$('#app');let pg;window.scrollTo(0,0);
 if(a==='checkout'){pg=checkout(b||'invalido');app.innerHTML=pg.html;document.title='Checkout · Vello';return}
 if(a==='app'){if(S.session!=='merchant'){location.hash='#/login';return}
  const key=P[b]?b:'dashboard';pg=P[key](c);app.innerHTML=shellMerchant(key==='venda'?'links':key,pg.title,pg.html);document.title=pg.title.replace(/<[^>]+>/g,'')+' · Vello'}
 else if(a==='admin'){if(b==='login'||!b){pg=A.login();app.innerHTML=pg.html}else{if(S.session!=='admin'){location.hash='#/admin/login';return}
  const key=A[b]?b:'dashboard';pg=A[key]();app.innerHTML=shellAdmin(key,pg.title,pg.html);document.title=pg.title+' · Admin Vello'}}
 else{if(S.session==='merchant'&&a==='login'){location.hash='#/app/dashboard';return}pg=(P[a==='cadastro'?'cadastro':'login'])();app.innerHTML=pg.html}
 pg.mount&&pg.mount()}
document.addEventListener('mousemove',e=>{const k=e.target.closest&&e.target.closest('.kpi.main');if(!k)return;const r=k.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;k.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-2px)`});
document.addEventListener('mouseout',e=>{const k=e.target.closest&&e.target.closest('.kpi.main');if(k)k.style.transform=''});
